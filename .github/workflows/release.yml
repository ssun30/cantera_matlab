name: MATLAB Release
# This workflow produces and publishes the release artifacts:
#   Cantera_MATLAB_Toolbox_<version>.mltbx
#   cantera-matlab-interface-<os>.zip        (compiled interface + library, os-specific)
# The interface cannot live inside the .mltbx (File Exchange policy), so the
# package declares these zips as RequiredAdditionalSoftware and MATLAB fetches
# the right one at install time. Their URLs are built from this tag, so the
# asset names here and in ctPackageToolbox.m must agree.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      incoming_ref:
        description: 'Ref in Cantera/cantera to package; leave blank for the default'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # TEMP (pre-alpha): package the in-development interface from the fork.
  # After merging into Cantera/cantera, set CANTERA_REPO back and restore
  # release-tag / latest-release ref resolution in the "resolve" job.
  CANTERA_REPO: ssun30/cantera
  CANTERA_DEFAULT_REF: matlab_autoConfigure
  # Build artifacts with the minimum supported release so the generated
  # interface loads on that release and later.
  MATLAB_RELEASE: R2024b
  BOOST_ROOT: ${{ github.workspace }}/3rdparty/boost
  BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-b2-nodocs.7z

jobs:
  resolve:
    name: Resolve Cantera ref and version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve ref and version
        id: resolve
        env:
          INCOMING_REF: ${{ inputs.incoming_ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # TEMP (pre-alpha): build against CANTERA_DEFAULT_REF on the fork.
          # After merge, restore: tag push -> the matching Cantera release.
          REF="${INCOMING_REF:-$CANTERA_DEFAULT_REF}"

          # X.Y.Z from the pushed tag; a placeholder for manual dispatch.
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$(printf '%s' "$REF_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          fi
          VERSION="${VERSION:-0.0.0}"

          echo "Cantera source:  $CANTERA_REPO@$REF"
          echo "Toolbox version: $VERSION"

          {
            echo "ref=$REF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package on ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-14
            label: macos
          - os: windows-2025
            label: windows

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: ${{ needs.resolve.outputs.version }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANTERA_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: cantera
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons and Cantera build dependencies
        run: |
          python -m pip install --upgrade \
            'scons>=4.0' packaging jinja2 ruamel.yaml

      - name: Install Boost and doxygen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen

      - name: Install Boost and doxygen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --display-times boost doxygen
          echo "BOOST_INC_DIR=$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Cache Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-1.87.0-${{ runner.os }}

      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        run: |
          BOOST_ROOT=$(echo "$BOOST_ROOT" | sed 's/\\/\//g')
          if [ ! -d "$BOOST_ROOT/boost" ]; then
            mkdir -p "$BOOST_ROOT"
            curl --progress-bar --location --output "$BOOST_ROOT/download.7z" -L "$BOOST_URL"
            7z -o"$BOOST_ROOT" x "$BOOST_ROOT/download.7z" -y -bd boost-1.87.0/boost
            mv "$BOOST_ROOT/boost-1.87.0/boost" "$BOOST_ROOT/boost"
            rm "$BOOST_ROOT/download.7z"
          fi
          echo "BOOST_INC_DIR=$BOOST_ROOT" >> "$GITHUB_ENV"

      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install doxygen.install -y --no-progress
          echo "C:/Program Files/doxygen/bin" >> "$GITHUB_PATH"

      # MATLAB_RELEASE (R2024b) supports Visual C++ 2022 at newest, but
      # windows-2025 ships a newer Visual Studio, so mex finds no compiler it
      # recognises. Install the 2022 build tools alongside it.
      - name: Install Visual C++ 2022 build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -products '*' -format value -property displayName || true

      # setup-python points it at its own lib directory, which MATLAB then
      # inherits and crashes on. Nothing here needs it.
      - name: Keep LD_LIBRARY_PATH out of MATLAB's environment
        if: runner.os != 'Windows'
        run: echo "LD_LIBRARY_PATH=" >> "$GITHUB_ENV"

      # MATLAB bundles an older libstdc++ than the toolchain clibgen
      # compiles the interface with, and dies without
      # the system one preloaded. cantera_shared links it statically
      # and needs nothing. Do not remove with the conda dependencies.
      - name: Set LD_PRELOAD for MATLAB (Linux)
        if: runner.os == 'Linux'
        run: |
          LIB_STDCXX=$(ldconfig -p | grep libstdc++.so.6 | awk '{print $4}' | head -n 1)
          echo "LD_PRELOAD=$LIB_STDCXX" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Build the toolbox and interface
        uses: matlab-actions/run-build@v3
        with:
          tasks: buildInterface

      # Gate on self-containment before anything is published: this is the
      # exact file users receive, and a missed dependency here is a broken
      # install for everyone on this platform.
      - name: Audit the shipped library
        run: |
          lib=$(find "TMP/toolbox/+ct/+impl/ctMatlab" \
                -name '*cantera_shared*' ! -type l | head -1)
          echo "shipped library: $lib"
          test -n "$lib" || { echo "no library beside the interface"; exit 1; }
          python buildUtilities/audit_library.py --library "$lib"

      - name: Archive the interface (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd TMP/toolbox/+ct/+impl
          zip -r "$GITHUB_WORKSPACE/cantera-matlab-interface-${{ matrix.label }}.zip" ctMatlab

      - name: Archive the interface (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path "TMP/toolbox/+ct/+impl/ctMatlab"
          -DestinationPath "cantera-matlab-interface-${{ matrix.label }}.zip"

      - name: Upload the interface artifact
        uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.label }}
          path: cantera-matlab-interface-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Upload the toolbox (.mltbx)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-mltbx
          path: release/*.mltbx
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.mltbx
            dist/**/*.zip
          generate_release_notes: true
