name: MATLAB Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      incoming_ref:
        description: 'Ref in Cantera/cantera to package; leave blank for latest release'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# TEMP (pre-alpha): package the in-development MATLAB interface from the fork
# feature branch. After merging into Cantera/cantera, set CANTERA_REPO back to
# "Cantera/cantera" and restore release-tag / latest-release ref resolution and
# libcantera-devel version pinning in the "resolve" job below.
env:
  CANTERA_REPO: ssun30/cantera
  CANTERA_DEFAULT_REF: matlab_autoConfigure

jobs:
  resolve:
    name: Resolve Cantera ref and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      lib_spec: ${{ steps.resolve.outputs.lib_spec }}
    steps:
      - name: Resolve ref, version, and conda spec
        id: resolve
        env:
          INCOMING_REF: ${{ inputs.incoming_ref }}
        run: |
          # --- Cantera source ref ---
          # TEMP (pre-alpha): build against CANTERA_DEFAULT_REF on the fork.
          # After merge, restore: tag push -> github.ref_name, otherwise the
          # latest Cantera release (gh api repos/Cantera/cantera/releases/latest).
          if [ -n "$INCOMING_REF" ]; then
            REF="$INCOMING_REF"
          else
            REF="$CANTERA_DEFAULT_REF"
          fi

          # --- Toolbox version for the .mltbx ---
          # Use the pushed tag's X.Y.Z if present, otherwise a placeholder.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$(printf '%s' "${{ github.ref_name }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          fi
          VERSION="${VERSION:-0.0.0}"

          # --- conda library spec ---
          # TEMP (pre-alpha): track latest libcantera-devel for the dev branch.
          # After merge, restore pinning for releases: libcantera-devel=$VERSION.
          LIB_SPEC="libcantera-devel"

          echo "Cantera source:    $CANTERA_REPO@$REF"
          echo "Toolbox version:   $VERSION"
          echo "conda library:     $LIB_SPEC"

          {
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "lib_spec=$LIB_SPEC"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & test on ${{ matrix.label }}
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera-src
      TOOLBOX_VERSION: ${{ needs.resolve.outputs.version }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out packaging repo
        uses: actions/checkout@v4

      - name: Check out Cantera source
        uses: actions/checkout@v4
        with:
          # TEMP (pre-alpha): fork source; see CANTERA_REPO env at top of file.
          repository: ${{ env.CANTERA_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
          path: cantera-src

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ct-dev
          channels: conda-forge

      - name: Install Cantera development dependency
        run: |
          conda install -y "${{ needs.resolve.outputs.lib_spec }}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            PREFIX="$(cygpath -w "$CONDA_PREFIX")"
            echo "CANTERA_INCLUDE_PATH=${PREFIX}\\Library\\include" >> "$GITHUB_ENV"
            echo "CANTERA_LIB_PATH=${PREFIX}\\Library\\bin" >> "$GITHUB_ENV"
          else
            echo "CANTERA_INCLUDE_PATH=$CONDA_PREFIX/include" >> "$GITHUB_ENV"
            echo "CANTERA_LIB_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Set LD_PRELOAD for MATLAB (Linux)
        if: runner.os == 'Linux'
        run: |
          LIB_STDCXX=$(ldconfig -p | grep libstdc++.so.6 | awk '{print $4}' | head -n 1)
          LIB_OPENBLAS=$(ldconfig -p | grep libopenblas.so.0 | awk '{print $4}' | head -n 1)
          LIB_LAPACK=$(ldconfig -p | grep liblapack.so.3 | awk '{print $4}' | head -n 1)
          echo "LD_PRELOAD=$LIB_STDCXX:$LIB_OPENBLAS:$LIB_LAPACK" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Build, package, and test the toolbox
        uses: matlab-actions/run-build@v3
        with:
          tasks: test

      - name: Archive interface library (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd TMP/toolbox/+ct/+impl
          zip -r "$GITHUB_WORKSPACE/cantera-matlab-interface-${{ matrix.label }}.zip" ctMatlab

      - name: Archive interface library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive
          -Path "TMP/toolbox/+ct/+impl/ctMatlab"
          -DestinationPath "cantera-matlab-interface-${{ matrix.label }}.zip"

      - name: Upload interface library artifact
        uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.label }}
          path: cantera-matlab-interface-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Upload toolbox (.mltbx) artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-mltbx
          path: release/*.mltbx
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.mltbx
            dist/**/*.zip
          generate_release_notes: true
