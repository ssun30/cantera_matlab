name: MATLAB Release
# Produces and publishes Cantera_MATLAB_Toolbox_<version>.mltbx. Each platform
# job builds the compiled interface and library; the package job merges all
# three into one stage and packages once, so a single .mltbx serves every
# platform. File Exchange accepts binaries in a package built by CI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      incoming_ref:
        description: 'Ref in CANTERA_REPO to package; leave blank for CANTERA_DEFAULT_REF'
        required: false
        default: ''
      test_release:
        description: 'Test the release job with a draft release (nothing is published)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # TEMP (pre-alpha): package the in-development interface from the fork.
  # After the Cantera PRs are merged, set CANTERA_REPO to Cantera/cantera and
  # CANTERA_DEFAULT_REF to the Cantera ref to package.
  CANTERA_REPO: ssun30/cantera
  # cantera_matlab_demo_branch combines the pending Cantera PRs (#2187 and #2177).
  CANTERA_DEFAULT_REF: cantera_matlab_demo_branch
  # Build artifacts with the minimum supported release so the generated
  # interface loads on that release and later.
  MATLAB_RELEASE: R2024b
  BOOST_ROOT: ${{ github.workspace }}/3rdparty/boost
  BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-b2-nodocs.7z

jobs:
  resolve:
    name: Resolve Cantera ref and version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve ref and version
        id: resolve
        env:
          INCOMING_REF: ${{ inputs.incoming_ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The Cantera source: CANTERA_DEFAULT_REF, or the ref given when the
          # workflow is run manually.
          REF="${INCOMING_REF:-$CANTERA_DEFAULT_REF}"

          # The toolbox version is chosen by the maintainer through the tag
          # (X.Y.Z from the pushed tag) and need not match the Cantera version.
          # Manual runs use a placeholder. main.yml applies the same rule.
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$(printf '%s' "$REF_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          fi
          VERSION="${VERSION:-0.0.0}"

          echo "Cantera source:  $CANTERA_REPO@$REF"
          echo "Toolbox version: $VERSION"

          {
            echo "ref=$REF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.label }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: macos-14
            label: macos
          - os: windows-2025
            label: windows

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: ${{ needs.resolve.outputs.version }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANTERA_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: cantera
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons and Cantera build dependencies
        run: |
          python -m pip install --upgrade \
            'scons>=4.0' packaging jinja2 ruamel.yaml

      - name: Install Boost and doxygen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen

      - name: Install Boost and doxygen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --display-times boost doxygen
          echo "BOOST_INC_DIR=$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        run: |
          BOOST_ROOT=$(echo "$BOOST_ROOT" | sed 's/\\/\//g')
          mkdir -p "$BOOST_ROOT"
          curl --progress-bar --location --output "$BOOST_ROOT/download.7z" -L "$BOOST_URL"
          7z -o"$BOOST_ROOT" x "$BOOST_ROOT/download.7z" -y -bd boost-1.87.0/boost
          mv "$BOOST_ROOT/boost-1.87.0/boost" "$BOOST_ROOT/boost"
          rm "$BOOST_ROOT/download.7z"
          echo "BOOST_INC_DIR=$BOOST_ROOT" >> "$GITHUB_ENV"

      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install doxygen.install -y --no-progress
          echo "C:/Program Files/doxygen/bin" >> "$GITHUB_PATH"

      # MATLAB_RELEASE (R2024b) supports Visual C++ 2022 at newest, but
      # windows-2025 ships a newer Visual Studio, so mex finds no compiler it
      # recognises. Install the 2022 build tools alongside it.
      - name: Install Visual C++ 2022 build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -products '*' -format value -property displayName || true

      - name: Keep LD_LIBRARY_PATH out of MATLAB's environment
        if: runner.os != 'Windows'
        run: echo "LD_LIBRARY_PATH=" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ env.MATLAB_RELEASE }}

      # On Linux, R2024b crashes while generating the interface unless the system
      # libstdc++ is preloaded. The interface and the Cantera library link
      # libstdc++ statically, so users do not need LD_PRELOAD to load them.
      - name: Build the interface
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        env:
          LD_PRELOAD: ${{ runner.os == 'Linux' && '/lib/x86_64-linux-gnu/libstdc++.so.6' || '' }}
        with:
          tasks: buildInterface

      # Gate on self-containment before anything is published: this is the
      # exact file users receive, and a missed dependency here is a broken
      # install for everyone on this platform.
      - name: Audit the shipped library
        run: |
          lib=$(find "TMP/toolbox/+ct/+impl/ctMatlab" \
                -name '*cantera_shared*' ! -type l | head -1)
          echo "shipped library: $lib"
          test -n "$lib" || { echo "no library beside the interface"; exit 1; }
          python TMP/toolbox/buildUtilities/audit_library.py --library "$lib"

      - name: Upload the interface
        uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.label }}
          path: TMP/toolbox/+ct/+impl/ctMatlab/
          if-no-files-found: error

  package:
    name: Package the toolbox
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CANTERA_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: cantera
          persist-credentials: false

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Stage the toolbox
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("buildUtilities"); ctStageToolbox();

      - name: Download the interfaces
        uses: actions/download-artifact@v4
        with:
          pattern: interface-*
          path: interfaces

      - name: Merge the interfaces into the stage
        run: |
          dest="TMP/toolbox/+ct/+impl/ctMatlab"
          mkdir -p "$dest"
          for dir in interfaces/interface-*; do
            for file in "$dir"/*; do
              name=$(basename "$file")
              if [ -e "$dest/$name" ]; then
                echo "::error::$name is provided by more than one platform"
                exit 1
              fi
              cp "$file" "$dest/"
            done
          done
          ls -l "$dest"

      - name: Package the toolbox
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath("buildUtilities"); ctPackageToolbox();

      - name: Upload the toolbox
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-mltbx
          path: release/*.mltbx
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.test_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the toolbox
        uses: actions/download-artifact@v4
        with:
          name: toolbox-mltbx
          path: dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.mltbx --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes

      - name: Create a draft release (test run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-${{ github.run_number }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/*.mltbx --repo "$GITHUB_REPOSITORY" \
            --draft --target "$TARGET" --generate-notes \
            --title "$TAG (test draft, do not publish)"
