name: Cantera MATLAB CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "README.MD"
      - "reports/**"
      - "release/**"
      - "TMP/**"

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    name: Test Cantera MATLAB toolbox
    runs-on: ubuntu-latest
    # Generous: a from-source Cantera build on a 4-core runner is far slower
    # than the conda install it replaced. The cache makes repeat runs quick.
    timeout-minutes: 120

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: 3.2.0

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          # TEMP (pre-alpha): build against the fork feature branch.
          # Revert to "Cantera/cantera" (default branch) after merge.
          repository: ssun30/cantera
          ref: matlab_autoConfigure
          path: cantera
          submodules: recursive

      # The Cantera library is now built from source by the buildCanteraLibrary
      # task with every dependency vendored and statically linked, so there is
      # no conda environment to install and, crucially, no LD_PRELOAD step:
      # the conda OpenBLAS/LAPACK/libstdc++ that MATLAB used to disagree with
      # are no longer linked at all.
      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # packaging is imported directly by Cantera's SConstruct; jinja2 and
      # ruamel.yaml are needed by sourcegen, which generates the cantera_clib
      # headers and sources at build time.
      - name: Install SCons and Cantera build dependencies
        run: |
          python -m pip install --upgrade \
            'scons>=4.0' packaging jinja2 ruamel.yaml

      # setup-python points LD_LIBRARY_PATH at its own lib directory, which is
      # then inherited by MATLAB. MATLAB resolves its bundled libraries through
      # that path and crashes in hard-to-diagnose ways when a foreign directory
      # precedes them. Nothing here needs it: ctBuildCanteraLibrary already
      # clears it for the SCons subprocess it launches.
      - name: Keep LD_LIBRARY_PATH out of MATLAB's environment
        run: echo "LD_LIBRARY_PATH=" >> "$GITHUB_ENV"

      # Boost is the one Cantera dependency not vendored under ext/. SConstruct
      # requires >= 1.83; ubuntu-latest packages 1.83. It is header-only for
      # Cantera's purposes, so it leaves no runtime dependency behind.
      #
      # doxygen is a hard build requirement, not a docs-only one: sourcegen
      # reads the Doxygen tag file to generate cantera_clib.
      - name: Install Boost headers and doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen

      # A full Cantera build is the slowest step in this workflow by a wide
      # margin. The task's own stamp file skips the rebuild when the Cantera
      # commit and the SCons flags are unchanged; this makes that skip work
      # across runners too.
      # Keyed on the Cantera commit, not this repo's: the pinned ref is a
      # moving branch, so the library must rebuild when it advances. A stale
      # restore is harmless anyway -- the task's stamp file records the commit
      # and forces a rebuild on mismatch.
      - name: Resolve Cantera commit
        id: cantera
        run: echo "sha=$(git -C cantera rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the built Cantera library
        uses: actions/cache@v4
        with:
          path: build/canteraLib
          key: canteraLib-${{ runner.os }}-${{ hashFiles('buildUtilities/build_cantera_library.py') }}-${{ steps.cantera.outputs.sha }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b

      # Split from "test" so a library-build failure is attributable on its
      # own, and so the built library can be inspected before the interface
      # build consumes it. The stamp file makes the later run a no-op.
      - name: Build the Cantera library
        uses: matlab-actions/run-build@v3
        with:
          tasks: buildCanteraLibrary

      - name: Inspect the built library
        run: |
          ls -l build/canteraLib/lib
          echo "--- soname and dependencies ---"
          readelf -d build/canteraLib/lib/libcantera_shared.so.* | head -20
          echo "--- a few exported symbols ---"
          nm -D --defined-only build/canteraLib/lib/libcantera_shared.so.* \
            | grep -c ' T ' || true

      # TEMP (diagnostic): clibgen kills the MATLAB process with an uncaught
      # std::exception, so try/catch cannot see it. Probe clibgen with a
      # trivial header first: if that also dies, clibgen is broken in this
      # environment regardless of Cantera's headers. Remove once green.
      - name: Probe clibgen with a trivial header
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: |
            header = fullfile(tempdir, "ctprobe.h");
            fid = fopen(header, "w");
            fprintf(fid, "int ctprobe_add(int a, int b);\n");
            fclose(fid);
            lib = fullfile(pwd, "build", "canteraLib", "lib", ...
                           "libcantera_shared.so.4");
            disp("probing clibgen with " + header);
            clibgen.generateLibraryDefinition(header, ...
                IncludePath = tempdir, ...
                Libraries = lib, ...
                OutputFolder = tempdir, ...
                InterfaceName = "ctprobe", ...
                OverwriteExistingDefinitionFiles = true, ...
                CLinkage = true, ...
                Verbose = true);
            disp("PROBE OK: clibgen works in this environment");

      - name: Collect MATLAB crash dumps
        if: always()
        run: |
          echo "--- crash dumps ---"
          find "$HOME" /tmp "$GITHUB_WORKSPACE" -maxdepth 3 \
            -name 'matlab_crash_dump*' -print -exec head -60 {} \; 2>/dev/null \
            || echo "none found"

      - name: Run buildtool tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: test
