name: Cantera MATLAB CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "README.MD"
      - "reports/**"
      - "release/**"
      - "TMP/**"

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    name: Test Cantera MATLAB toolbox
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: 3.2.0

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          # TEMP (pre-alpha): build against the fork feature branch.
          # Revert to "Cantera/cantera" (default branch) after merge.
          repository: ssun30/cantera
          ref: matlab_autoConfigure
          path: cantera
          submodules: recursive

      # The Cantera library is now built from source by the buildCanteraLibrary
      # task with every dependency vendored and statically linked, so there is
      # no conda environment to install and, crucially, no LD_PRELOAD step:
      # the conda OpenBLAS/LAPACK/libstdc++ that MATLAB used to disagree with
      # are no longer linked at all.
      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # jinja2 and ruamel.yaml are needed by sourcegen, which generates the
      # cantera_clib headers and sources at build time -- they are not checked
      # into the Cantera repo.
      - name: Install SCons and sourcegen dependencies
        run: python -m pip install --upgrade 'scons>=4.0' jinja2 ruamel.yaml

      # Boost is the one Cantera dependency not vendored under ext/. SConstruct
      # requires >= 1.83; ubuntu-latest packages 1.83. It is header-only for
      # Cantera's purposes, so it leaves no runtime dependency behind.
      #
      # doxygen is a hard build requirement, not a docs-only one: sourcegen
      # reads the Doxygen tag file to generate cantera_clib.
      - name: Install Boost headers and doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen

      # A full Cantera build is the slowest step in this workflow by a wide
      # margin. The task's own stamp file skips the rebuild when the Cantera
      # commit and the SCons flags are unchanged; this makes that skip work
      # across runners too.
      # Keyed on the Cantera commit, not this repo's: the pinned ref is a
      # moving branch, so the library must rebuild when it advances. A stale
      # restore is harmless anyway -- the task's stamp file records the commit
      # and forces a rebuild on mismatch.
      - name: Resolve Cantera commit
        id: cantera
        run: echo "sha=$(git -C cantera rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the built Cantera library
        uses: actions/cache@v4
        with:
          path: build/canteraLib
          key: canteraLib-${{ runner.os }}-${{ hashFiles('buildUtilities/build_cantera_library.py') }}-${{ steps.cantera.outputs.sha }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Run buildtool tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: test
