name: Cantera MATLAB CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - "README.md"
      - "README.MD"
      - "reports/**"
      - "release/**"
      - "TMP/**"

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / MATLAB ${{ matrix.release }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # The same OS images and MATLAB releases as the MATLAB CI in Cantera: each
        # image runs the oldest supported release (R2024b) and the newest one.
        os: [ubuntu-24.04, windows-2025, macos-14]
        release: [R2024b, latest]
        include:
          - os: macos-15
            release: latest

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: 3.2.0
      BOOST_ROOT: ${{ github.workspace }}/3rdparty/boost
      BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-b2-nodocs.7z

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          # TEMP (pre-alpha): build against the fork branch that combines the
          # pending Cantera PRs (#2187 and #2177). Revert to "Cantera/cantera"
          # (default branch) after they are merged.
          repository: ssun30/cantera
          ref: cantera_matlab_demo_branch
          path: cantera
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons and Cantera build dependencies
        run: |
          python -m pip install --upgrade \
            'scons>=4.0' packaging jinja2 ruamel.yaml

      - name: Install Boost and doxygen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen

      - name: Install Boost and doxygen (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --display-times boost doxygen
          echo "BOOST_INC_DIR=$(brew --prefix)/include" >> "$GITHUB_ENV"

      # This workflow publishes nothing (release.yml builds the release without
      # caches), so a poisoned cache cannot reach users.
      - name: Cache Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-1.87.0-${{ runner.os }}

      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        run: |
          BOOST_ROOT=$(echo "$BOOST_ROOT" | sed 's/\\/\//g')
          if [ ! -d "$BOOST_ROOT/boost" ]; then
            mkdir -p "$BOOST_ROOT"
            curl --progress-bar --location --output "$BOOST_ROOT/download.7z" -L "$BOOST_URL"
            7z -o"$BOOST_ROOT" x "$BOOST_ROOT/download.7z" -y -bd boost-1.87.0/boost
            mv "$BOOST_ROOT/boost-1.87.0/boost" "$BOOST_ROOT/boost"
            rm "$BOOST_ROOT/download.7z"
          fi
          echo "BOOST_INC_DIR=$BOOST_ROOT" >> "$GITHUB_ENV"

      - name: Install doxygen (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install doxygen.install -y --no-progress
          echo "C:/Program Files/doxygen/bin" >> "$GITHUB_PATH"

      # R2024b supports Visual C++ 2022 at newest, but windows-2025 ships a
      # newer Visual Studio, so mex finds no compiler it recognises. Install
      # the 2022 build tools alongside it. Not needed for MATLAB "latest".
      - name: Install Visual C++ 2022 build tools (Windows, R2024b)
        if: runner.os == 'Windows' && matrix.release == 'R2024b'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -products '*' -format value -property displayName || true

      # setup-python points it at its own lib directory, which MATLAB then
      # inherits and crashes on. Nothing here needs it.
      - name: Keep LD_LIBRARY_PATH out of MATLAB's environment
        if: runner.os != 'Windows'
        run: echo "LD_LIBRARY_PATH=" >> "$GITHUB_ENV"

      # Keyed on the Cantera commit: the pinned ref is a moving branch.
      - name: Resolve Cantera commit
        id: cantera
        run: echo "sha=$(git -C cantera rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the built Cantera library
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: build/canteraLib
          key: canteraLib-${{ matrix.os }}-${{ hashFiles('cantera/interfaces/matlab/buildUtilities/build_cantera_library.py') }}-${{ steps.cantera.outputs.sha }}

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ matrix.release }}

      # Split from the full workflow so a library failure is attributable on its own.
      # "buildInterface" runs this task again as a dependency; the stamp file skips
      # the rebuild, but it still re-exports CANTERA_INCLUDE_PATH/LIB_PATH, which
      # buildInterface needs and which do not survive between MATLAB sessions.
      - name: Build the Cantera library
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        with:
          tasks: buildCanteraLibrary

      # The build script audits what it builds, but skips on a cache hit, so
      # audit here too: a restored library must meet the same bar.
      - name: Audit the Cantera library
        run: python TMP/toolbox/buildUtilities/audit_library.py --prefix build/canteraLib

      - name: Add the Cantera library to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "${{ github.workspace }}/build/canteraLib/lib" >> "$GITHUB_PATH"

      # On Linux, R2024b crashes while generating the interface unless the system
      # libstdc++ is preloaded. Only building the interface needs it: the interface
      # and the Cantera library link libstdc++ statically, so the tests below load
      # the toolbox as users do, without LD_PRELOAD.
      - name: Build the interface
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        env:
          LD_PRELOAD: ${{ runner.os == 'Linux' && '/lib/x86_64-linux-gnu/libstdc++.so.6' || '' }}
        with:
          tasks: buildInterface

      # Skip the tasks that built the interface above: "stage" would delete TMP,
      # including the interface.
      - name: Run buildtool tests
        uses: matlab-actions/run-build@cf54c2229a74d57eb4e6ba1bbebd45793d37797e # v3.4.0
        with:
          tasks: test package
          build-options: -skip stage -skip buildCanteraLibrary -skip buildInterface
