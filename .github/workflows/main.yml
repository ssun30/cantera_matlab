name: Cantera MATLAB CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "README.MD"
      - "reports/**"
      - "release/**"
      - "TMP/**"

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test:
    name: Test Cantera MATLAB toolbox
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CANTERA_ROOT: ${{ github.workspace }}/cantera
      TOOLBOX_VERSION: 3.2.0

    steps:
      - name: Check out cantera_matlab
        uses: actions/checkout@v4

      - name: Check out Cantera
        uses: actions/checkout@v4
        with:
          # TEMP (pre-alpha): build against the fork feature branch.
          # Revert to "Cantera/cantera" (default branch) after merge.
          repository: ssun30/cantera
          ref: matlab_autoConfigure
          path: cantera
          submodules: recursive

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ct-dev
          channels: conda-forge

      - name: Install Cantera development dependency
        shell: bash -el {0}
        run: |
          conda install -y libcantera-devel

          echo "CANTERA_INCLUDE_PATH=$CONDA_PREFIX/include" >> "$GITHUB_ENV"
          echo "CANTERA_LIB_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CANTERA_INCLUDE_PATH=$CONDA_PREFIX/include"
          echo "CANTERA_LIB_PATH=$CONDA_PREFIX/lib"

      - name: Set LD_PRELOAD for MATLAB
        run: |
          LIB_STDCXX=$(ldconfig -p | grep libstdc++.so.6 | awk '{print $4}' | head -n 1)
          LIB_OPENBLAS=$(ldconfig -p | grep libopenblas.so.0 | awk '{print $4}' | head -n 1)
          LIB_LAPACK=$(ldconfig -p | grep liblapack.so.3 | awk '{print $4}' | head -n 1)
          echo "LD_PRELOAD=$LIB_STDCXX:$LIB_OPENBLAS:$LIB_LAPACK" >> "$GITHUB_ENV"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Run buildtool tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: test
